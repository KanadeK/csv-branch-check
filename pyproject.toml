[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-branch-check"
version = "0.1.0"
description = "Streaming CSV conditional validation using safe declarative JSON rules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "KanadeK"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
csv-branch-check = "csv_branch_check.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/csv-branch-check"
Issues = "https://github.com/KanadeK/csv-branch-check/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
